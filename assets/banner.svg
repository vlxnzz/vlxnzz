  @keyframes cursor { 0%,49% { opacity:1 } 50%,100% { opacity:0 } } .cur { animation: cursor 1s steps(1) infinite }
  @keyframes aura { 0%,100% { transform: scale(1); opacity:.9 } 50% { transform: scale(1.08); opacity:.6 } } .aura { animation: aura 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
  .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif } .mono { font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; font-family: 'Cascadia Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace }
  
  @keyframes b_flutua { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
  @keyframes b_pisca { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(0.1) } }
  @keyframes b_sombra { 0%,100% { transform: scaleX(1); opacity:.45 } 50% { transform: scaleX(.85); opacity:.3 } }
  .b_flutua { animation: b_flutua 3.6s ease-in-out infinite }
  .b_pisca { animation: b_pisca 5s infinite; transform-box: fill-box; transform-origin: center }
  .b_sombra { animation: b_sombra 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
</style>
