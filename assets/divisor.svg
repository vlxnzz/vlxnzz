<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="presentation">
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3"/></filter></defs>
<style>@keyframes viaja { 0% { transform: translateX(-380px) } 100% { transform: translateX(380px) } } .pt { animation: viaja 5s ease-in-out infinite alternate }
