<rect x="60" y="13" width="1080" height="2" fill="url(#l)"/>
<g class="pt"><circle cx="600" cy="14" r="7" fill="#8b5cf6" filter="url(#g)"/><circle cx="600" cy="14" r="2.6" fill="#fff"/></g>
<g class="di" transform="translate(600 14) rotate(45)"><rect x="-5" y="-5" width="10" height="10" fill="#0a0a0f" stroke="#a78bfa" stroke-width="1.6"/></g>
</svg>