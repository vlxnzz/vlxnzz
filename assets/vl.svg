<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 310" width="1280" height="310" role="img" aria-label="VL">
<defs>
  <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0f"/><stop offset="0.55" stop-color="#150a30"/><stop offset="1" stop-color="#2a1260"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <!-- o raio: faixa de luz roxa, mais clara no centro -->
  <linearGradient id="raio" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset="0.35" stop-color="#8b5cf6" stop-opacity="0.95"/><stop offset="0.5" stop-color="#e9ddff"/><stop offset="0.65" stop-color="#8b5cf6" stop-opacity="0.95"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
  <mask id="soLetras" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="310"><g fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"><polyline points="490,86 555,226 620,86"/><polyline points="702,86 702,226 792,226"/></g></mask>
  <filter id="brilho" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="desfoque" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="cartao"><rect width="1280" height="310" rx="22"/></clipPath>
</defs>
<style>
  @keyframes est { 0%,100% { opacity: .1 } 50% { opacity: .9 } } .est { animation: est 3s ease-in-out infinite }
  /* vai e volta: o raio cruza as letras da esquerda pra direita e retorna */
  @keyframes varre { 0% { transform: translateX(-260px) skewX(-22deg) } 100% { transform: translateX(1380px) skewX(-22deg) } }
  .raio { animation: varre 3.4s cubic-bezier(.45,0,.55,1) infinite alternate }
  @keyframes respira { 0%,100% { opacity: .55 } 50% { opacity: .95 } } .halo { animation: respira 3.2s ease-in-out infinite }
  @keyframes barra { 0%,100% { opacity: 1 } 50% { opacity: .3 } } .barra { animation: barra 2.6s ease-in-out infinite }
</style>
<g clip-path="url(#cartao)">
  <rect width="1280" height="310" fill="url(#fundo)"/>
  <circle cx="0" cy="134" r="1.0" fill="#a78bfa" class="est" style="animation-delay:0.2s;animation-duration:5.1s"/><circle cx="523" cy="155" r="1.2" fill="#a78bfa" class="est" style="animation-delay:1.9s;animation-duration:3.3s"/><circle cx="280" cy="214" r="0.8" fill="#a78bfa" class="est" style="animation-delay:1.5s;animation-duration:4.3s"/><circle cx="1058" cy="115" r="0.7" fill="#a78bfa" class="est" style="animation-delay:0.9s;animation-duration:4.7s"/><circle cx="758" cy="166" r="1.2" fill="#a78bfa" class="est" style="animation-delay:0.9s;animation-duration:3.4s"/><circle cx="1019" cy="3" r="0.9" fill="#a78bfa" class="est" style="animation-delay:2.3s;animation-duration:4.6s"/><circle cx="17" cy="115" r="1.8" fill="#a78bfa" class="est" style="animation-delay:2.1s;animation-duration:2.8s"/><circle cx="782" cy="288" r="1.0" fill="#a78bfa" class="est" style="animation-delay:3.6s;animation-duration:2.6s"/><circle cx="918" cy="242" r="1.8" fill="#a78bfa" class="est" style="animation-delay:1.1s;animation-duration:3.0s"/><circle cx="1023" cy="284" r="1.6" fill="#a78bfa" class="est" style="animation-delay:4.0s;animation-duration:4.9s"/><circle cx="552" cy="77" r="1.4" fill="#a78bfa" class="est" style="animation-delay:0.1s;animation-duration:5.4s"/><circle cx="1064" cy="106" r="1.7" fill="#a78bfa" class="est" style="animation-delay:0.0s;animation-duration:4.5s"/><circle cx="1218" cy="165" r="1.5" fill="#a78bfa" class="est" style="animation-delay:2.0s;animation-duration:5.1s"/><circle cx="555" cy="278" r="1.9" fill="#a78bfa" class="est" style="animation-delay:1.7s;animation-duration:4.9s"/><circle cx="650" cy="68" r="0.7" fill="#a78bfa" class="est" style="animation-delay:0.2s;animation-duration:5.0s"/><circle cx="139" cy="105" r="1.3" fill="#a78bfa" class="est" style="animation-delay:1.5s;animation-duration:3.9s"/><circle cx="136" cy="114" r="0.8" fill="#a78bfa" class="est" style="animation-delay:2.3s;animation-duration:4.2s"/><circle cx="1184" cy="30" r="1.9" fill="#a78bfa" class="est" style="animation-delay:4.0s;animation-duration:4.8s"/><circle cx="723" cy="111" r="1.7" fill="#a78bfa" class="est" style="animation-delay:2.6s;animation-duration:4.0s"/><circle cx="391" cy="160" r="0.9" fill="#a78bfa" class="est" style="animation-delay:3.8s;animation-duration:4.2s"/><circle cx="1165" cy="44" r="0.8" fill="#a78bfa" class="est" style="animation-delay:3.8s;animation-duration:4.6s"/><circle cx="369" cy="248" r="1.1" fill="#a78bfa" class="est" style="animation-delay:3.5s;animation-duration:3.9s"/><circle cx="651" cy="69" r="0.7" fill="#a78bfa" class="est" style="animation-delay:3.2s;animation-duration:5.1s"/><circle cx="336" cy="227" r="1.0" fill="#a78bfa" class="est" style="animation-delay:3.4s;animation-duration:3.8s"/><circle cx="1" cy="6" r="0.6" fill="#a78bfa" class="est" style="animation-delay:2.2s;animation-duration:3.4s"/><circle cx="1034" cy="95" r="1.4" fill="#a78bfa" class="est" style="animation-delay:4.0s;animation-duration:4.0s"/>
  <ellipse class="halo" cx="640" cy="156" rx="330" ry="150" fill="url(#halo)"/>
  <!-- letras brancas com brilho roxo -->
  <g fill="none" stroke="#f0eeff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#brilho)"><polyline points="490,86 555,226 620,86"/><polyline points="702,86 702,226 792,226"/></g>
  <!-- raio de luz que passa só por cima das letras -->
  <g mask="url(#soLetras)"><rect class="raio" x="0" y="0" width="240" height="310" fill="url(#raio)"/></g>
  <!-- e um clarão suave ao redor, acompanhando o raio -->
  <g opacity="0.55"><rect class="raio" x="0" y="0" width="240" height="310" fill="url(#raio)" filter="url(#desfoque)"/></g>
  <rect class="barra" x="594" y="266" width="92" height="9" rx="3" fill="#8b5cf6"/>
</g>
</svg>